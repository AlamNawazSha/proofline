[project]
name = "proofline"
version = "0.2.0"
description = "Proofline — evidence before approval"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pypdf>=5,<7",
    "reportlab>=4,<5",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "pillow>=11,<13",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

